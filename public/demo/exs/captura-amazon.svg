  <text x="116" y="316" font-size="12" fill="#4b5563">Cantidad: 1</text>
  <!-- rastreo -->
  <rect x="18" y="350" width="324" height="40" rx="20" fill="#ffd814"/>
  <text x="180" y="375" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Rastrear paquete</text>
  <rect x="18" y="404" width="324" height="70" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="32" y="428" font-size="11" fill="#4b5563">Número de rastreo</text>
  <text x="32" y="450" font-size="16" font-weight="700" fill="#111827" letter-spacing="0.5">TBA318274650012</text>
  <text x="32" y="466" font-size="11" fill="#4b5563">Transportista: Amazon Logistics</text>
  <!-- envío -->
  <text x="18" y="506" font-size="13" font-weight="700" fill="#111827">Dirección de envío</text>
  <text x="18" y="526" font-size="12" fill="#374151">María José Hernández</text>
  <text x="18" y="543" font-size="12" fill="#374151">EXS-10482</text>
  <text x="18" y="560" font-size="12" fill="#374151">Miami, FL, Estados Unidos</text>
  <line x1="18" y1="580" x2="342" y2="580" stroke="#e5e7eb"/>
  <!-- totales -->
  <text x="18" y="606" font-size="12" fill="#374151">Subtotal de productos</text>
  <text x="342" y="606" font-size="12" fill="#374151" text-anchor="end">$89.99</text>
