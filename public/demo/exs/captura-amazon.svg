  <!-- producto -->
  <rect x="18" y="244" width="86" height="86" rx="8" fill="#f3f4f6"/>
  <path d="M38 300 v-18 a23 23 0 0 1 46 0 v18" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>
  <rect x="32" y="292" width="13" height="22" rx="5" fill="#1f2937"/>
  <rect x="77" y="292" width="13" height="22" rx="5" fill="#1f2937"/>
  <text x="116" y="262" font-size="13" font-weight="700" fill="#111827">Sony WH-CH720N</text>
  <text x="116" y="280" font-size="12" fill="#374151">Audífonos inalámbricos con</text>
